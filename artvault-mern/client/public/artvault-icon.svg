<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CB8"/>
      <stop offset="55%" stop-color="#4C2E85"/>
      <stop offset="100%" stop-color="#2A1548"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="markcolor" x1="150" y1="80" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F3EDFB"/>
      <stop offset="100%" stop-color="#E4D6F7"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1C0E33" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- app-icon base -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#sheen)"/>

  <!-- signature mark: a fingerprint drawn as broken brushstroke rings —
       every artist's identity is unique, and this is where it's kept safe.
       one ridge escapes the whorl and unravels into a single brush flick,
       the print becoming the art it protects. -->
  <g filter="url(#soft)">
    <path d="M 309.9,163.0 A 94,94 0 1 1 223.9,151.7" fill="none" stroke="url(#markcolor)" stroke-width="17" stroke-linecap="round"/>
    <path d="M 269.2,314.8 A 76,76 0 1 1 321.8,278.0" fill="none" stroke="url(#markcolor)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 231.5,187.4 A 58,58 0 1 1 198.9,229.9" fill="none" stroke="url(#markcolor)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 292.3,256.9 A 40,40 0 1 1 290.6,220.0" fill="none" stroke="url(#markcolor)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 235.3,247.5 A 22,22 0 1 1 252.2,261.7" fill="none" stroke="url(#markcolor)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="256" cy="240" r="4.5" fill="url(#markcolor)"/>

    <!-- the escaping ridge, tapering into a brush flick -->
    <path d="M 255.2,144.0 Q 263.9,110.2 191.7,84.8 Q 232.3,112.2 281.7,147.5 Z" fill="url(#markcolor)"/>
  </g>
</svg>
